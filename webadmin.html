<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080B13">
<meta name="robots" content="noindex,nofollow">
<title>پنل مدیریت جفج شاهنشاهی</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css">
<style>
@font-face{font-family:"Peyda";src:url(/admin/assets/Peyda-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Peyda";src:url(/admin/assets/Peyda-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Estedad";src:url(/admin/assets/Estedad-Medium.woff2) format("woff2");font-weight:500;font-display:swap}
:root{
  --bg:#080B13;--bg2:#0D0F1B;--card:#111520;--card2:#171D2D;--card3:#0E131E;--inner:#161D2C;--line:#242A38;
  --blue-d:#19243D;--blue-g:#1D2B4A;--green-g:#123B38;--purple-g:#282237;
  --gold:#E9B653;--green:#50CFA5;--blue:#638CF5;--steel:#A6BCD8;--lime:#A8C94A;--red:#C83E5A;--lime2:#B4E65A;
  --lav:#C3B5FF;--violet:#9167F7;--blue2:#5685FF;--amber:#F5B94C;--teal:#20B98B;--sky:#8CBFFF;--orange:#FF995C;--rose:#F05270;
  --tx:#E8EDF7;--tx2:#A6BCD8;--tx3:#7C8AA5;
  --r-card:20px;--r-in:14px;
  --f:"Peyda","Vazirmatn","Estedad",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{font-size:13.5px}
body{background:var(--bg);color:var(--tx);font-family:var(--f);line-height:1.7;min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg.i{width:1.25em;height:1.25em;fill:currentColor;flex:none;display:block}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.top{position:sticky;top:0;z-index:30;height:56px;display:flex;align-items:center;gap:8px;padding:0 12px;background:rgba(8,11,19,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r-in);padding:5px 10px 5px 8px;height:40px}
.brand b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:var(--r-in);background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--tx2);position:relative}
.ib:active{background:var(--card2)}
.ib .dot{position:absolute;top:-5px;inset-inline-end:-4px;min-width:16px;height:16px;border-radius:8px;background:var(--rose);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
.side{position:fixed;z-index:50;inset-block:0;inset-inline-start:0;width:290px;max-width:86vw;background:var(--bg2);border-inline-end:1px solid var(--line);transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column}
.side.open{transform:none}
.veil{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s}
.veil.on{opacity:1;pointer-events:auto}
.side .hd{display:flex;align-items:center;gap:10px;padding:14px 14px 10px}
.side .hd .hc{width:38px;height:38px;border-radius:13px;background:var(--blue-g);color:var(--blue);display:grid;place-items:center}.side .hd .hc svg{width:22px;height:22px}
.side .hd b{display:block;font-size:14px}.side .hd span{font-size:11px;color:var(--tx3)}
.side nav{flex:1;overflow:auto;padding:4px 10px 14px}
.grp{margin-top:8px}
.grp>button{width:100%;display:flex;align-items:center;justify-content:space-between;color:var(--tx3);font-size:11.5px;padding:8px}
.grp>button svg{width:16px;height:16px;transition:transform .2s}
.grp.shut>button svg{transform:rotate(-90deg)}
.grp.shut .items{display:none}
.nv{width:100%;display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:var(--r-in);color:var(--tx2);font-size:13px;text-align:start;margin-bottom:2px}
.nv .ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--inner);color:var(--tx2);flex:none}
.nv .ico svg{width:18px;height:18px}
.nv .bd{margin-inline-start:auto;background:var(--rose);color:#fff;font-size:10.5px;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px}
.nv.on{background:var(--blue-g);color:#fff}
.nv.on .ico{background:var(--blue);color:#06101f}
.side .ft{padding:10px;border-top:1px solid var(--line)}
main{padding:14px 12px 90px;max-width:1180px;margin:0 auto}
@media(min-width:1000px){
  .side{transform:none;width:262px}
  .shell{padding-inline-start:262px}
  .top{padding-inline-start:274px}
  .veil{display:none}
  .top .menu{display:none}
  main{padding:22px 26px 60px}
}
.ph{display:flex;align-items:center;gap:12px;margin:2px 0 14px}
.ph .bk{flex:none;width:42px;height:42px}.ph .bk svg{width:20px;height:20px}
.ph .chip{width:44px;height:44px;border-radius:15px;background:var(--blue-g);color:var(--blue);display:grid;place-items:center;flex:none}
.ph .chip svg{width:24px;height:24px}
.ph h1{font-size:19px;line-height:1.3}
.ph p{color:var(--tx3);font-size:12px}
.ph .act{margin-inline-start:auto;display:flex;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:16px;margin-bottom:16px}
.card>h3{font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card>h3 .sub{margin-inline-start:auto;font-weight:400;font-size:11.5px;color:var(--tx3)}
.grid{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media(min-width:700px){.grid.c3{grid-template-columns:repeat(3,1fr)}.grid.c4{grid-template-columns:repeat(4,1fr)}.two{display:grid;grid-template-columns:1.6fr 1fr;gap:12px}.two>*{min-width:0}}
.grid.c3{grid-template-columns:1fr 1fr 1fr}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stat .t{display:flex;align-items:center;gap:8px;color:var(--tx2);font-size:12px}
.stat .t .c{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none}
.stat .t .c svg{width:17px;height:17px}
.stat .v{font-size:20px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v small{font-size:11px;font-weight:400;color:var(--tx3);margin-inline-start:4px}
.stat .s{font-size:11.5px;color:var(--tx3)}
.tone-b{background:var(--blue-g);color:var(--blue)}.tone-g{background:var(--green-g);color:var(--green)}.tone-p{background:var(--purple-g);color:var(--lav)}.tone-y{background:var(--blue-g);color:var(--sky)}.tone-r{background:#3a1822;color:var(--rose)}.tone-o{background:#3a2518;color:var(--orange)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 9px;border-radius:99px;background:var(--inner);color:var(--tx2);white-space:nowrap}
.pill.g{background:var(--green-g);color:var(--green)}.pill.r{background:#3a1822;color:var(--rose)}.pill.y{background:var(--blue-g);color:var(--sky)}.pill.b{background:var(--blue-g);color:var(--sky)}
.quick{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin-bottom:12px}
.quick button{display:flex;align-items:center;gap:7px;white-space:nowrap;padding:8px 13px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--tx2);font-size:12.5px}
.quick button svg{width:16px;height:16px;color:var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 15px;border-radius:var(--r-in);background:var(--inner);border:1px solid var(--line);color:var(--tx);font-size:13px;white-space:nowrap;text-decoration:none}
.btn svg{width:17px;height:17px}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#06101f;font-weight:700}
.btn.grn{background:var(--green);border-color:var(--green);color:#06231b;font-weight:700}
.btn.red{background:#3a1822;border-color:#5a2434;color:var(--rose)}
.btn.sm{height:32px;padding:0 11px;font-size:12px;border-radius:11px}
.btn.blk{width:100%}
.btn:disabled{opacity:.5}
.in{width:100%;background:var(--card3);border:1px solid var(--line);border-radius:var(--r-in);padding:9px 12px;font-size:13px;min-height:40px}
textarea.in{min-height:110px;resize:vertical;line-height:1.8}
.in:focus{border-color:var(--blue);outline:0}
.lbl{display:block;font-size:12px;color:var(--tx2);margin:10px 0 5px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}
.row .av{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--inner);color:var(--tx2)}
.row .av svg{width:19px;height:19px}
.row .m{flex:1;min-width:0}
.row .m b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m span{display:block;font-size:11.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .e{display:flex;align-items:center;gap:6px;flex:none}
.tap{cursor:pointer}.tap:active{background:var(--card3)}
.sw{width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:#cfd8ea;transition:transform .15s}
.sw.on{background:var(--teal)}.sw.on::after{transform:translateX(-18px);background:#fff}
.tabs{display:flex;gap:4px;background:var(--card3);border:1px solid var(--line);border-radius:var(--r-in);padding:3px;overflow:auto}
.tabs button{flex:1;padding:6px 12px;border-radius:11px;font-size:12px;color:var(--tx3);white-space:nowrap}
.tabs button.on{background:var(--blue-g);color:#fff}
.empty{text-align:center;color:var(--tx3);padding:26px 10px;font-size:12.5px}
.empty svg{width:34px;height:34px;margin:0 auto 8px;color:var(--line)}
.note{background:var(--blue-d);border:1px solid #243457;border-radius:var(--r-in);padding:10px 12px;color:var(--steel);font-size:12px;margin-bottom:12px}
.tpl{background:var(--card3);border:1px dashed var(--line);border-radius:var(--r-in);padding:9px 11px;font-size:12px;color:var(--tx2);white-space:pre-wrap;max-height:150px;overflow:auto;word-break:break-word}
.tx{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.tx .txh{display:flex;align-items:center;gap:10px;margin-bottom:8px;color:var(--tx3);font-size:11.5px}.tx .txh .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tx .txh svg{width:17px;height:17px;color:var(--blue)}
.tx .txb{font-size:13px;line-height:1.9;color:var(--tx);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;word-break:break-word}
.hint{color:var(--tx3);font-size:12px;margin-bottom:10px}
.sheet-w{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6)}
.sheet{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:26px 26px 0 0;padding:16px 14px 20px;animation:up .2s ease}
@media(min-width:700px){.sheet-w{align-items:center}.sheet{border-radius:26px}}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.sheet h2{font-size:15px;margin-bottom:6px}
.sheet .btns{display:flex;gap:8px;margin-top:14px}.sheet .btns .btn{flex:1}
.toast{position:fixed;z-index:90;bottom:22px;inset-inline:12px;max-width:420px;margin:auto;background:var(--card2);border:1px solid var(--line);border-radius:var(--r-in);padding:11px 14px;font-size:13px;display:flex;gap:9px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.toast.err{border-color:#5a2434;color:#ffc0cc}.toast.ok svg{color:var(--green)}.toast.err svg{color:var(--rose)}
.toast svg{width:19px;height:19px}
.chart{position:relative;direction:ltr}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.chart text{fill:var(--tx3);font-size:10.5px;font-family:var(--f)}
.tip{position:absolute;pointer-events:none;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:7px 10px;font-size:12px;white-space:nowrap;direction:rtl;transform:translate(-50%,-115%);box-shadow:0 8px 22px rgba(0,0,0,.4);z-index:5}
.tip b{display:block;color:var(--blue);font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--tx2)}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:3px}
.donut{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
.donut svg{width:150px;height:150px}
.login{min-height:100vh;display:grid;place-items:center;padding:16px;background:radial-gradient(900px 420px at 50% -10%,var(--blue-g),transparent 70%),var(--bg)}
.login .box{width:100%;max-width:370px;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:22px 18px}
.login .lc{width:60px;height:60px;border-radius:20px;background:var(--blue-g);color:var(--blue);display:grid;place-items:center;margin:0 auto 12px}.login .lc svg{width:32px;height:32px}
.login h1{text-align:center;font-size:18px}.login p{text-align:center;color:var(--tx3);font-size:12px;margin-bottom:8px}
.sp{height:8px}
.hide{display:none!important}
.ltr{direction:ltr;text-align:left;unicode-bidi:plaintext}
</style>
</head>
