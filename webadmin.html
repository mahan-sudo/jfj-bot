<title>پنل مدیریت جفج</title>

@font-face{font-family:"Estedad";src:url(/admin/assets/Estedad-Medium.woff2) format("woff2");font-weight:500;font-display:swap}

[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--tx);font-family:var(--fn);font-size:15px;line-height:1.75;background:var(--bg)}
body{background:radial-gradient(900px 500px at 85% -5%,var(--gb)66,transparent 70%),radial-gradient(700px 480px at 0% 105%,var(--gg)55,transparent 70%),linear-gradient(var(--bg),var(--bg2));background-attachment:fixed;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
svg.ic{width:1.25em;height:1.25em;fill:currentColor;flex:none;vertical-align:-.28em}
.shell{display:flex;min-height:100vh}
aside{display:none;width:250px;flex:none;position:sticky;top:0;height:100vh;padding:18px 14px;background:linear-gradient(var(--c3)cc,var(--c1)cc);border-left:1px solid var(--ln);flex-direction:column;gap:2px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 16px;font-weight:700;font-size:16px}.brand img{width:34px;height:34px;border-radius:10px}
.grp{color:var(--mu);font-size:12px;padding:14px 12px 5px}
.nv{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-radius:12px;padding:10px 12px;color:#B9C1D6;cursor:pointer;text-align:right;font-size:14.5px}
.nv:hover{background:var(--c2)}.nv.on{background:linear-gradient(90deg,var(--gb),var(--c2));color:var(--gold);font-weight:700;box-shadow:inset 0 0 0 1px var(--ln)}
.side-foot{margin-top:auto;background:var(--c2);border:1px solid var(--ln);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:8px;font-size:13px}
main{flex:1;min-width:0;max-width:1000px;margin:0 auto;padding:22px 18px 100px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:16px}
.top h1{margin:0;font-size:26px;line-height:1.3}.top p{margin:2px 0 0;color:var(--mu);font-size:13.5px}
.card{background:linear-gradient(180deg,var(--c1),var(--c3));border:1px solid var(--ln);border-radius:20px;padding:16px;margin:0 0 14px;box-shadow:0 10px 30px #00000040}
.card>h3{margin:0 0 10px;font-size:16px;display:flex;gap:8px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
.stat{background:linear-gradient(180deg,var(--c2),var(--c1));border:1px solid var(--ln);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;transition:transform .15s}
.stat[data-go]{cursor:pointer}.stat[data-go]:hover{transform:translateY(-2px);border-color:#34405a}
.chip{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px}
.stat b{font-size:22px;line-height:1.2}.stat span{color:var(--mu);font-size:12.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:9px 16px;background:linear-gradient(135deg,var(--gold),var(--i11));color:var(--onp);font-weight:700;cursor:pointer;box-shadow:0 6px 18px #e9b65326}
.btn.g{background:var(--sh);border:1px solid var(--ln);color:var(--tx);box-shadow:none}
.btn.ok{background:linear-gradient(135deg,var(--green),var(--i9));color:#042016;box-shadow:none}
.btn.no{background:linear-gradient(135deg,var(--i12),var(--red));color:#fff;box-shadow:none}
.btn.s{padding:5px 11px;font-size:13px;border-radius:10px}.btn:disabled{opacity:.45;cursor:not-allowed}
input,textarea,select{width:100%;background:var(--sh);border:1px solid var(--ln);border-radius:14px;padding:11px 13px;outline:0;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{border-color:var(--sky);box-shadow:0 0 0 3px #638cf526}
input[type=checkbox]{width:auto}
textarea{min-height:120px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:0 0 auto}.row>.f{flex:1 1 130px}
.mu{color:var(--mu);font-size:13px}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:9px;padding:0 9px;font-size:12px;background:var(--sh);border:1px solid var(--ln);color:var(--i1)}
.tag.ok{color:var(--green);border-color:#50cfa544;background:#123b3855}.tag.no{color:var(--i12);border-color:#f0527044;background:#c83e5a22}.tag.gd{color:var(--gold);border-color:#e9b65344}
.item{border-bottom:1px solid var(--ln);padding:11px 0}.item:last-child{border:0}
.item.click{cursor:pointer;border-radius:10px}.item.click:hover{background:#ffffff06}
.seg{display:inline-flex;background:var(--sh);border:1px solid var(--ln);border-radius:14px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:11px;padding:6px 13px;color:var(--mu);cursor:pointer}.seg button.on{background:var(--gb);color:var(--tx);box-shadow:inset 0 0 0 1px #334a7a}
bottomnav,nav{position:fixed;inset:auto 0 0 0;background:#0e131eee;backdrop-filter:blur(12px);border-top:1px solid var(--ln);display:flex;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:2px;z-index:5}
nav button{flex:1 0 auto;min-width:62px;background:none;border:0;border-radius:12px;padding:5px 6px;color:var(--mu);font-size:11.5px;cursor:pointer;display:grid;justify-items:center;gap:0}
nav button svg{width:22px;height:22px}nav button.on{color:var(--gold);background:var(--c2)}
@media(min-width:900px){aside{display:flex}nav{display:none}main{padding-bottom:40px}}
.login{max-width:400px;margin:11vh auto 0;padding:26px}.login h2{margin:8px 0 4px;font-size:22px}.login .lg{width:56px;height:56px;border-radius:16px;box-shadow:0 10px 30px #638cf544}
.err{color:var(--i12);min-height:22px;font-size:13.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#1d2b4a;border:1px solid #334a7a;color:#fff;border-radius:14px;padding:10px 18px;z-index:9;max-width:90vw;box-shadow:0 10px 30px #0008}
code{background:var(--sh);border:1px solid var(--ln);border-radius:7px;padding:0 6px;direction:ltr;unicode-bidi:embed;font-size:12.5px;font-family:ui-monospace,Menlo,Consolas,monospace}
.hint{background:var(--sh);border:1px dashed #34405a;border-radius:14px;padding:10px 12px;font-size:12.5px;color:var(--mu)}
summary{list-style:none}summary::-webkit-details-marker{display:none}
details>summary{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:700}
details>summary::after{content:"";margin-inline-start:auto;width:8px;height:8px;border:solid var(--mu);border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .2s}
details[open]>summary::after{transform:rotate(-135deg)}

async function api(path,body,method){
  const o={method:method||(body===undefined?"GET":"POST"),headers:{"X-Requested-With":"jfj"},credentials:"same-origin"};
  if(body!==undefined){o.headers["Content-Type"]="application/json";o.body=JSON.stringify(body)}
  const r=await fetch("/admin/api/"+path,o);let j={};try{j=await r.json()}catch(e){}
  if(r.status===401&&j.login){showLogin();throw new Error("auth")}
  if(!r.ok||j.ok===false)throw new Error(j.error||"خطا");return j}

/* ---------- ورود ---------- */
function showLogin(){
  nav.hidden=true;side.hidden=true;
  const id=h("input",{inputmode:"numeric",placeholder:"آیدی عددی تلگرام",autocomplete:"username",dir:"ltr"});
  const pw=h("input",{type:"password",placeholder:"رمز",autocomplete:"current-password",dir:"ltr"});
  const er=h("div",{class:"err"});
  const go=async()=>{er.textContent="";try{await api("login",{id:id.value,password:pw.value});start()}catch(e){er.textContent=e.message}};
  pw.addEventListener("keydown",e=>{if(e.key==="Enter")go()});
  app.replaceChildren(h("div",{class:"login card"},h("img",{class:"lg",src:"/admin/assets/logo.webp",alt:""}),h("h2",{},"پنل مدیریت"),
    h("p",{class:"mu"},"آیدی عددی و رمز اختصاصی‌ات را وارد کن. رمز را از دکمه‌ی «پنل تحت وب» داخل پنل ربات می‌گیری."),
    h("div",{style:"display:grid;gap:10px"},id,pw,er,B("","user","ورود",go))));
}
