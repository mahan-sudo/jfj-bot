<style>
@font-face{font-family:"Peyda";src:url(/admin/assets/Peyda-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Peyda";src:url(/admin/assets/Peyda-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Estedad";src:url(/admin/assets/Estedad-Medium.woff2) format("woff2");font-weight:500;font-display:swap}
:root{
  --bg:#0E0F13;--bg2:#0B0C10;--card:#15161A;--card2:#1C1D22;--card3:#111216;--inner:#1D1E24;--line:#2A2C34;
  --blue-d:#19243D;--blue-g:#1D2B4A;--green-g:#123B38;--purple-g:#282237;
  --gold:#E9B653;--green:#50CFA5;--blue:#638CF5;--steel:#A6BCD8;--lime:#A8C94A;--red:#C83E5A;--lime2:#B4E65A;
  --lav:#C3B5FF;--violet:#9167F7;--cyan:#53D3E6;--pink:#F27CC9;--indigo:#8497FF;--coral:#FF8470;--blue2:#5685FF;--amber:#F5B94C;--teal:#20B98B;--sky:#8CBFFF;--orange:#FF995C;--rose:#F05270;
  --tx:#E8EDF7;--tx2:#A6BCD8;--tx3:#7C8AA5;
  --rose-g:#3a1822;--rose-bd:#5a2434;--note-bd:#243457;--top:rgba(8,11,19,.92);--on-pri:#06101f;--on-sel:#fff;--on-grn:#06231b;--err-tx:#ffc0cc;
  --sw-off:#242A38;--sw-knob:#cfd8ea;--shade:rgba(0,0,0,.45);
  --r-card:17px;--r-in:12px;
  --f:"Peyda","Vazirmatn","Estedad",system-ui,sans-serif;color-scheme:dark;
}
/* تم ۲: اقیانوسی شب  (#05081B · #04A3ED · #0472ED) */
html[data-theme="ocean"]{
  --bg:#05081B;--bg2:#070C25;--card:#0A1030;--card2:#0F1840;--card3:#070B26;--inner:#0E1741;--line:#1A2760;
  --blue-d:#0A2250;--blue-g:#083578;--green-g:#0A3A3F;--purple-g:#1B1F52;
  --blue:#04A3ED;--blue2:#0472ED;--sky:#5CC6FA;--steel:#9DB9E6;--tx:#E8F1FF;--tx2:#9DB6DE;--tx3:#6A80AE;
  --rose-g:#3a1530;--rose-bd:#5a2040;--note-bd:#12306B;--top:rgba(5,8,27,.92);--on-pri:#031222;--sw-off:#1A2760;
}
/* تم روز نیوی */
html[data-theme="navy-day"]{
  --bg:#EEF2FA;--bg2:#FFFFFF;--card:#FFFFFF;--card2:#F4F7FD;--card3:#F5F8FD;--inner:#E8EEF9;--line:#DCE3F1;
  --blue-d:#EAF0FF;--blue-g:#DCE6FF;--green-g:#DDF5EC;--purple-g:#ECE6FF;
  --gold:#B8860B;--green:#0B8F6A;--blue:#3F6BE0;--steel:#4A5D80;--lav:#6B45D9;--violet:#6B45D9;--blue2:#2F5BD0;--amber:#B97A06;--teal:#0E9F77;--sky:#2F5BD0;--orange:#D9661A;--rose:#D6334F;--cyan:#0A8FA5;--pink:#C2318F;--indigo:#4B5FD8;--coral:#D9533C;--lime:#5E8A10;
  --tx:#0E1630;--tx2:#4A5873;--tx3:#7684A0;
  --rose-g:#FDE5EA;--rose-bd:#F4B9C6;--note-bd:#C9D8F8;--top:rgba(238,242,250,.92);--on-pri:#fff;--on-sel:#1B3FA8;--on-grn:#fff;--err-tx:#B4233C;
  --sw-off:#C5CEE0;--sw-knob:#fff;--shade:rgba(30,50,90,.18);color-scheme:light;
}
/* تم روز اقیانوسی */
html[data-theme="ocean-day"]{
  --bg:#E9F5FD;--bg2:#FFFFFF;--card:#FFFFFF;--card2:#F1F9FE;--card3:#F3FAFE;--inner:#E1F0FB;--line:#D1E5F4;
  --blue-d:#E4F2FD;--blue-g:#D0EAFC;--green-g:#DDF5EC;--purple-g:#ECE6FF;
  --gold:#B8860B;--green:#0B8F6A;--blue:#0472ED;--blue2:#04A3ED;--steel:#3E5A7E;--lav:#6B45D9;--violet:#6B45D9;--amber:#B97A06;--teal:#0E9F77;--sky:#0460C8;--orange:#D9661A;--rose:#D6334F;--cyan:#0A8FA5;--pink:#C2318F;--indigo:#4B5FD8;--coral:#D9533C;--lime:#5E8A10;
  --tx:#05081B;--tx2:#3F4F6E;--tx3:#6E7F9C;
  --rose-g:#FDE5EA;--rose-bd:#F4B9C6;--note-bd:#BFE0F6;--top:rgba(233,245,253,.92);--on-pri:#fff;--on-sel:#04489A;--on-grn:#fff;--err-tx:#B4233C;
  --sw-off:#BFD3E4;--sw-knob:#fff;--shade:rgba(5,80,140,.18);color-scheme:light;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{font-size:11.5px}
body{background:var(--bg);color:var(--tx);font-family:var(--f);line-height:1.7;min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg.i{width:1.25em;height:1.25em;fill:currentColor;flex:none;display:block}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.top{position:sticky;top:0;z-index:30;height:47px;display:flex;align-items:center;gap:6.5px;padding:0 10px;background:var(--top);backdrop-filter:blur(8.5px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:7.5px;flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r-in);padding:4px 8.5px 4px 6.5px;height:33.5px}
.brand b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:33.5px;height:33.5px;border-radius:var(--r-in);background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--tx2);position:relative}
.ib:active{background:var(--card2)}
.ib .dot{position:absolute;top:-4px;inset-inline-end:-3.5px;min-width:13.5px;height:13.5px;border-radius:6.5px;background:var(--rose);color:#fff;font-size:8.5px;display:grid;place-items:center;padding:0 3.5px}
.side{position:fixed;z-index:50;inset-block:0;inset-inline-start:0;width:243.5px;max-width:86vw;background:var(--bg2);border-inline-end:1px solid var(--line);transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column}
.side.open{transform:none}
.veil{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s}
.veil.on{opacity:1;pointer-events:auto}
.side .hd{display:flex;align-items:center;gap:8.5px;padding:12px 12px 8.5px}
.side .hd .hc{width:32px;height:32px;border-radius:11px;background:var(--blue-g);color:var(--blue);display:grid;place-items:center}.side .hd .hc svg{width:18.5px;height:18.5px}
.side .hd b{display:block;font-size:12px}.side .hd span{font-size:9px;color:var(--tx3)}
.side nav{flex:1;overflow:auto;padding:3.5px 8.5px 12px}
.grp{margin-top:6.5px}
.grp>button{width:100%;display:flex;align-items:center;justify-content:space-between;color:var(--tx3);font-size:9.5px;padding:6.5px}
.grp>button svg{width:13.5px;height:13.5px;transition:transform .2s}
.grp.shut>button svg{transform:rotate(-90deg)}
.grp.shut .items{display:none}
.nv{width:100%;display:flex;align-items:center;gap:9px;padding:6.5px 8.5px;border-radius:var(--r-in);color:var(--tx2);font-size:11px;text-align:start;margin-bottom:2px}
.nv .ico{width:27px;height:27px;border-radius:8.5px;display:grid;place-items:center;background:var(--inner);color:var(--tx2);flex:none}
.nv .ico svg{width:15px;height:15px}
.nv .bd{margin-inline-start:auto;background:var(--rose);color:#fff;font-size:9px;min-width:17px;height:17px;border-radius:8.5px;display:grid;place-items:center;padding:0 5px}
.nv.on{background:var(--blue-g);color:var(--on-sel)}
.nv.on .ico{background:var(--blue);color:var(--on-pri)}
.side .ft{padding:8.5px;border-top:1px solid var(--line)}
main{padding:12px 10px 75.5px;max-width:991px;margin:0 auto}
@media(min-width:1000px){
  .side{transform:none;width:220px}
  .shell{padding-inline-start:220px}
  .top{padding-inline-start:230px}
  .veil{display:none}
  .top .menu{display:none}
  main{padding:18.5px 22px 50.5px}
}
.ph{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
.ph .bk{flex:none;width:35.5px;height:35.5px}.ph .bk svg{width:17px;height:17px}
.ph .chip{width:37px;height:37px;border-radius:12.5px;background:var(--blue-g);color:var(--blue);display:grid;place-items:center;flex:none}
.ph .chip svg{width:20px;height:20px}
.ph h1{font-size:16px;line-height:1.3}
.ph p{color:var(--tx3);font-size:10px}
.ph .act{margin-inline-start:auto;display:flex;gap:6.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:13.5px;margin-bottom:13.5px}
.card>h3{font-size:12px;margin-bottom:8.5px;display:flex;align-items:center;gap:6.5px}
.card>h3 .sub{margin-inline-start:auto;font-weight:400;font-size:9.5px;color:var(--tx3)}
.grid{display:grid;gap:8.5px;grid-template-columns:1fr 1fr}
@media(min-width:700px){.grid.c3{grid-template-columns:repeat(3,1fr)}.grid.c4{grid-template-columns:repeat(4,1fr)}.two{display:grid;grid-template-columns:1.6fr 1fr;gap:10px}.two>*{min-width:0}}
.grid.c3{grid-template-columns:1fr 1fr 1fr}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:10px;display:flex;flex-direction:column;gap:5px;min-width:0}
.stat .t{display:flex;align-items:center;gap:6.5px;color:var(--tx2);font-size:10px}
.stat .t .c{width:25px;height:25px;border-radius:8.5px;display:grid;place-items:center;flex:none}
.stat .t .c svg{width:14.5px;height:14.5px}
.stat .v{font-size:17px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v small{font-size:9px;font-weight:400;color:var(--tx3);margin-inline-start:3.5px}
.stat .s{font-size:9.5px;color:var(--tx3)}
.tone-b{background:var(--blue-g);color:var(--blue)}.tone-g{background:var(--green-g);color:var(--green)}.tone-p{background:var(--purple-g);color:var(--lav)}.tone-y{background:var(--blue-g);color:var(--sky)}.tone-r{background:var(--rose-g);color:var(--rose)}.tone-o{background:#3a2518;color:var(--orange)}
.pill{display:inline-flex;align-items:center;gap:3.5px;font-size:9px;padding:1px 7.5px;border-radius:83px;background:var(--inner);color:var(--tx2);white-space:nowrap}
.pill.g{background:var(--green-g);color:var(--green)}.pill.r{background:var(--rose-g);color:var(--rose)}.pill.y{background:var(--blue-g);color:var(--sky)}.pill.b{background:var(--blue-g);color:var(--sky)}
.quick{display:flex;gap:6.5px;overflow:auto;padding-bottom:3.5px;margin-bottom:10px}
.quick button{display:flex;align-items:center;gap:6px;white-space:nowrap;padding:6.5px 11px;border-radius:83px;background:var(--card);border:1px solid var(--line);color:var(--tx2);font-size:10.5px}
.quick button svg{width:13.5px;height:13.5px;color:var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12.5px;border-radius:var(--r-in);background:var(--inner);border:1px solid var(--line);color:var(--tx);font-size:11px;white-space:nowrap;text-decoration:none}
.btn svg{width:14.5px;height:14.5px}
.btn.pri{background:linear-gradient(135deg,var(--blue),var(--blue2));border-color:var(--blue);color:var(--on-pri);font-weight:700}
.btn.grn{background:var(--green);border-color:var(--green);color:var(--on-grn);font-weight:700}
.btn.red{background:var(--rose-g);border-color:var(--rose-bd);color:var(--rose)}
.btn.sm{height:27px;padding:0 9px;font-size:10px;border-radius:9px}
.btn.blk{width:100%}
.btn:disabled{opacity:.5}
.in{width:100%;background:var(--card3);border:1px solid var(--line);border-radius:var(--r-in);padding:7.5px 10px;font-size:11px;min-height:33.5px}
textarea.in{min-height:92.5px;resize:vertical;line-height:1.8}
.in:focus{border-color:var(--blue);outline:0}
.lbl{display:block;font-size:10px;color:var(--tx2);margin:8.5px 0 4px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}
.row .av{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--inner);color:var(--tx2)}
.row .av svg{width:16px;height:16px}
.row .m{flex:1;min-width:0}
.row .m b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m span{display:block;font-size:9.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .e{display:flex;align-items:center;gap:5px;flex:none}
.tap{cursor:pointer}.tap:active{background:var(--card3)}
.sw{width:35.5px;height:20px;border-radius:83px;background:var(--sw-off);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:2.5px;inset-inline-start:2.5px;width:15px;height:15px;border-radius:50%;background:var(--sw-knob);transition:transform .15s}
.sw.on{background:var(--teal)}.sw.on::after{transform:translateX(-15px);background:#fff}
.tabs{display:flex;gap:3.5px;background:var(--card3);border:1px solid var(--line);border-radius:var(--r-in);padding:2.5px;overflow:auto}
.tabs button{flex:1;padding:5px 10px;border-radius:9px;font-size:10px;color:var(--tx3);white-space:nowrap}
.tabs button.on{background:var(--blue-g);color:var(--on-sel)}
.empty{text-align:center;color:var(--tx3);padding:22px 8.5px;font-size:10.5px}
.empty svg{width:28.5px;height:28.5px;margin:0 auto 6.5px;color:var(--line)}
.note{background:var(--blue-d);border:1px solid var(--note-bd);border-radius:var(--r-in);padding:8.5px 10px;color:var(--steel);font-size:10px;margin-bottom:10px}
.tpl{background:var(--card3);border:1px dashed var(--line);border-radius:var(--r-in);padding:7.5px 9px;font-size:10px;color:var(--tx2);white-space:pre-wrap;max-height:126px;overflow:auto;word-break:break-word}
.tx{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px;margin-bottom:10px}
.tx .txh{display:flex;align-items:center;gap:8.5px;margin-bottom:6.5px;color:var(--tx3);font-size:9.5px}.tx .txh .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tx .txh svg{width:14.5px;height:14.5px;color:var(--blue)}
.tx .txb{font-size:11px;line-height:1.9;color:var(--tx);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;word-break:break-word}
.hint{color:var(--tx3);font-size:10px;margin-bottom:8.5px}
.sheet-w{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,8,20,.55)}
.sheet{width:100%;max-width:437px;max-height:88vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:13.5px 12px 17px;animation:up .2s ease}
@media(min-width:700px){.sheet-w{align-items:center}.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(20px);opacity:0}}
.sheet h2{font-size:12.5px;margin-bottom:5px}
.sheet .btns{display:flex;gap:6.5px;margin-top:12px}.sheet .btns .btn{flex:1}
.toast{position:fixed;z-index:90;bottom:18.5px;inset-inline:10px;max-width:353px;margin:auto;background:var(--card2);border:1px solid var(--line);border-radius:var(--r-in);padding:9px 12px;font-size:11px;display:flex;gap:7.5px;align-items:center;box-shadow:0 8.5px 25px rgba(0,0,0,.45)}
.toast.err{border-color:var(--rose-bd);color:var(--err-tx)}.toast.ok svg{color:var(--green)}.toast.err svg{color:var(--rose)}
.toast svg{width:16px;height:16px}
.chart{position:relative;direction:ltr}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.chart text{fill:var(--tx3);font-size:10.5px;font-family:var(--f)}
.tip{position:absolute;pointer-events:none;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:6px 8.5px;font-size:10px;white-space:nowrap;direction:rtl;transform:translate(-50%,-115%);box-shadow:0 6.5px 18.5px rgba(0,0,0,.4);z-index:5}
.tip b{display:block;color:var(--blue);font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:5px 12px;font-size:10px;color:var(--tx2)}
.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:8.5px;height:8.5px;border-radius:2.5px}
.donut{display:flex;align-items:center;gap:13.5px;flex-wrap:wrap;justify-content:center}
.donut svg{width:126px;height:126px}
.login{min-height:100vh;display:grid;place-items:center;padding:13.5px;background:radial-gradient(756px 353px at 50% -10%,var(--blue-g),transparent 70%),var(--bg)}
.login .box{width:100%;max-width:311px;background:var(--card);border:1px solid var(--line);border-radius:23.5px;padding:18.5px 15px}
.login .lc{width:50.5px;height:50.5px;border-radius:17px;background:var(--blue-g);color:var(--blue);display:grid;place-items:center;margin:0 auto 10px}.login .lc svg{width:27px;height:27px}
.login h1{text-align:center;font-size:15px}.login p{text-align:center;color:var(--tx3);font-size:10px;margin-bottom:6.5px}
.sp{height:6.5px}
.hide{display:none!important}
img.em{width:1.15em;height:1.15em;vertical-align:-.2em;display:inline-block;margin:0 .05em}
.ltr{direction:ltr;text-align:left;unicode-bidi:plaintext}
/* ---- v7: انیمیشن و اجزای جدید ---- */
.sw{transition:background .22s ease}
.sw::after{transition:transform .26s cubic-bezier(.3,1.5,.5,1),width .15s ease,background .2s;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.sw:active::after{width:19px}.sw.on:active::after{transform:translateX(-19px)}
.sw.busy{opacity:.65}
.pgf{animation:pgf .26s cubic-bezier(.2,.75,.25,1)}.pgb{animation:pgb .26s cubic-bezier(.2,.75,.25,1)}
@keyframes pgf{from{opacity:0;transform:translateX(-18px)}}
@keyframes pgb{from{opacity:0;transform:translateX(18px)}}
.sheet-w{animation:fd .18s ease}@keyframes fd{from{opacity:0}}
.sheet{animation:up .26s cubic-bezier(.2,.8,.25,1)}
.row.tap,.tx.tap,.btn,.ib,.tabs button{transition:background .15s,transform .12s,opacity .15s}
.row.tap:active,.tx.tap:active{transform:scale(.985)}.btn:active,.ib:active{transform:scale(.95)}
.tabs button{transition:background .2s,color .2s}
.toast{animation:up .24s cubic-bezier(.2,.8,.25,1)}
.kvs{background:var(--card3);border:1px solid var(--line);border-radius:var(--r-in);padding:2px 10px;margin-bottom:8px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:10.5px}
.kv:last-child{border:0}.kv span{color:var(--tx3);flex:none}.kv b{font-weight:500;text-align:end;word-break:break-all}
.lk{display:flex;align-items:center;gap:6px;background:var(--card3);border:1px solid var(--line);border-radius:var(--r-in);padding:6px 8px;margin-bottom:8px}

/* ---- مرحله‌ی ۳: تب‌های بخش و فهرست‌های جمع‌شونده ---- */
.pgtabs{position:sticky;top:60px;z-index:20;margin-bottom:12px;background:var(--bg);box-shadow:0 0 0 6px var(--bg)}
.pgtabs button{flex:1}
@media(max-width:999px){.pgh{display:none!important}}
@media(min-width:1000px){.pgtabs{display:none}}
.fold{display:none!important}
.fq{margin:0 0 8px}.more{margin-top:8px;font-size:12px}
.card>.fq+.row{border-top:0}

/* ---- نوار پیشرفت (meter): ۴ بخش با فاصله‌ی ۲ پیکسلی، سر گرد، رنگ هم‌دسته ---- */
.mt{--t:var(--blue);margin:8px 0 0}
.mt.t-g{--t:var(--teal)}
.mt-h{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;color:var(--tx3);margin-bottom:8px}.mt-h b{font-size:12px;color:var(--tx);font-weight:700}
.mt-b{position:relative;height:6px;border-radius:3px;background:color-mix(in srgb,var(--t) 16%,transparent);overflow:hidden}
.mt-b i{display:block;height:100%;background:var(--t);border-start-end-radius:3px;border-end-end-radius:3px;transition:width .6s cubic-bezier(.2,.8,.25,1);animation:grow .8s cubic-bezier(.2,.8,.25,1)}
.mt-b::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to left,transparent 0,transparent calc(25% - 2px),var(--card) calc(25% - 2px),var(--card) 25%)}
.row .mt-b::after{background:repeating-linear-gradient(to left,transparent 0,transparent calc(25% - 2px),var(--card) calc(25% - 2px),var(--card) 25%)}
.mt-n{display:flex;justify-content:space-between;font-size:11.5px;color:var(--tx3);margin-top:8px}
.row .mt{margin-top:8px}
.bar{height:6px;border-radius:3px;background:color-mix(in srgb,var(--blue) 16%,transparent);margin:8px 0 0}.bar i{background:var(--blue);border-radius:3px}
/* کاشی‌های آمارِ پهن (دارای نمودار) روی موبایل: متن کنار، نمودار گوشه */
@media(max-width:699px){
  .stat.wide{grid-column:1/-1;display:grid;grid-template-columns:1fr minmax(0,46%);column-gap:16px;align-items:center}
  .stat.wide>.t,.stat.wide>.v,.stat.wide>.s{grid-column:1}
  .stat.wide>.spk{grid-column:2;grid-row:1/4;order:0;margin:0;align-self:center}
  .stat.wide>.spk svg{max-width:none}
}

.stat.wide{row-gap:4px}
@media(max-width:699px){
  .grid.c3 .stat{padding:12px}

  .grid.c3 .stat .v{font-size:22px}

.stat .t{min-width:0}.stat .t>span:not(.c){min-width:0;overflow:hidden;text-overflow:ellipsis}

/* ردیف‌های دارای چند دکمه: دکمه‌ها زیر عنوان می‌روند تا عنوان بریده نشود */
.row .m span{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media(max-width:699px){
  .card:not(.tiles)>.row:has(.e .btn){flex-wrap:wrap;row-gap:8px}

.pgtabs button.on::after{transform:scaleX(1)}

.card.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-content:start}

}
