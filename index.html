const okBox = (title, inner) => `<div class="glass round" style="position:relative;margin:16px 16px 0;background:linear-gradient(100deg,color-mix(in srgb,var(--agreen) 10%,transparent),transparent 70%),var(--surface);border-radius:36px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;color:var(--agreen);flex-shrink:0"><svg aria-hidden="true" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none"><rect x="0.6" y="0.6" width="calc(100% - 1.2px)" height="calc(100% - 1.2px)" rx="36" ry="36" fill="none" style="stroke:var(--agreen)" stroke-opacity=".5" stroke-width="1.2" stroke-dasharray="2.5 3"></rect></svg><div style="display:flex;align-items:center;gap:10px">${ic(P.okc, 24, 1.9)}<span style="font-size:15px;font-weight:800">${title}</span></div>${inner}</div>`;
const TONES = [['tint', 'accent'], ['gifttint', 'gifticon'], ['violettint', 'violet'], ['minttint', 'mint']];
const avatarHtml = (size, isz, dot) => { const ph = D() && D().user.photo; return `<span style="position:relative;display:block;width:${size}px;height:${size}px;flex-shrink:0"><span class="round" style="position:absolute;top:0;right:0;bottom:0;left:0;border-radius:${size / 2}px;overflow:hidden;background:linear-gradient(140deg,#2832C8 0%,#A855F7 60%,#F5A524 100%);display:flex;align-items:center;justify-content:center;color:#FFFFFF;box-shadow:0 0 0 2px var(--edge),0 6px 18px rgba(40,50,200,0.35)">${ic(P.user, isz, 1.9)}${ph ? `<span style="position:absolute;top:0;right:0;bottom:0;left:0;background:url('${esc(ph)}') center/cover no-repeat"></span>` : ''}</span>${dot ? `<span class="round" aria-hidden="true" style="position:absolute;right:0;bottom:0;width:${dot}px;height:${dot}px;border-radius:50%;background:#22C55E;box-shadow:0 0 0 ${dot > 14 ? 3 : 2}px var(--bg),0 0 8px rgba(34,197,94,0.6)"></span>` : ''}</span>`; };
const chAvatar = (photo, i) => { const t = TONES[i % 4]; return `<span class="round" style="position:relative;width:48px;height:48px;flex-shrink:0;border-radius:24px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--${t[0]});color:var(--${t[1]})">${ic(P.mega)}<span style="position:absolute;top:0;right:0;bottom:0;left:0;background:url('${esc(photo)}') center/cover no-repeat"></span></span>`; };
const note = (t) => `<div ${glass(36, '14px 18px', 'margin:12px 16px 0;display:flex;align-items:center;gap:12px;flex-shrink:0')}><span style="color:var(--muted);display:flex;flex-shrink:0">${ic(P.info, 20)}</span><span style="font-size:13px;line-height:1.7;font-weight:500">${t}</span></div>`;
const primaryBtn = (act, label, icon = '', data = '', dis = false) => `<button class="round press" data-act="${act}" ${data} ${dis ? 'disabled' : ''} style="width:100%;height:56px;border:0;border-radius:28px;background:var(--primary);color:#FFFFFF;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;box-shadow:var(--pshadow);opacity:${dis ? .55 : 1};transition:opacity .3s ease">${icon}<span>${label}</span></button>`;
const badge = (cls, text) => { const m = { bad: ['ared', 'aredt'], wait: ['gifticon', 'gifttint'], active: ['accent', 'tint'], done: ['mint', 'minttint'], gift: ['gifticon', 'gifttint'] }[cls]; return `<span style="font-size:12px;font-weight:700;border-radius:20px;padding:3px 12px;color:var(--${m[0]});background:var(--${m[1]})">${text}</span>`; };
const bar = (pct, done) => `<div style="height:6px;border-radius:999px;background:var(--track);overflow:hidden"><div style="height:6px;border-radius:999px;width:${pct}%;background:var(--${done ? 'mintfill' : 'primary'});box-shadow:0 0 8px var(--${done ? 'mintfill' : 'primary'});transition:width .5s cubic-bezier(0.22,1,0.36,1)"></div></div>`;
const slide = (n, i, pad, gap, bg, shadow, radius) => `position:absolute;top:${pad}px;bottom:${pad}px;right:${pad}px;width:calc((100% - ${2 * pad + (n - 1) * gap}px) / ${n});border-radius:${radius}px;background:${bg};box-shadow:${shadow};transform:translateX(calc(${-i * 100}% - ${i * gap}px));transition:transform .45s cubic-bezier(0.22,1,0.36,1),background-color .32s ease-out;pointer-events:none`;
const seg = (n, idx, items) => `<div class="glass round" role="group" style="position:relative;margin:16px 16px 0;padding:4px;border-radius:28px;display:grid;grid-template-columns:repeat(${n},minmax(0,1fr));gap:4px;background:var(--surface);border:1px solid var(--edge);box-shadow:var(--shadow);flex-shrink:0"><div class="round" aria-hidden="true" style="${slide(n, idx, 4, 4, 'var(--primary)', 'var(--pshadow)', 24)}"></div>${items.map((it, i) => `<button class="round press" aria-pressed="${i === idx}" data-act="${it[0]}" data-v="${it[2] || ''}" style="position:relative;z-index:1;border:0;background:transparent;cursor:pointer;height:40px;border-radius:24px;font-size:13px;font-weight:600;padding:0 8px;transition:color .3s ease;color:${i === idx ? '#FFFFFF' : 'var(--muted)'}">${it[1]}</button>`).join('')}</div>`;
const tile = (amount, unit, price, on, act, i) => `<button class="glass round press" aria-pressed="${on}" data-act="${act}" data-i="${i}" style="position:relative;border:0;cursor:pointer;border-radius:36px;padding:10px 10px 9px;display:flex;flex-direction:column;align-items:center;color:var(--ink);transition:background-color .3s ease,box-shadow .3s ease;background:${on ? 'var(--tint)' : 'var(--surface)'};box-shadow:inset 0 0 0 ${on ? '2px var(--primary)' : '1px var(--edge)'},var(--shadow)"><span class="round" style="position:absolute;top:8px;left:8px;width:18px;height:18px;border-radius:9px;background:var(--primary);display:flex;align-items:center;justify-content:center;transition:opacity .3s ease,transform .3s cubic-bezier(0.22,1,0.36,1);opacity:${on ? 1 : 0};transform:scale(${on ? 1 : .4})"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><span style="font-size:22px;font-weight:800;line-height:1.3">${amount}</span><span style="font-size:12px;color:var(--muted);line-height:1.5">${unit}</span><span style="font-size:12px;font-weight:700;color:var(--accent);line-height:1.5;margin-top:1px">${price}</span></button>`;
const summary = (rows) => `<div ${glass(36, '14px 18px', 'margin:12px 16px 0;display:flex;flex-direction:column;gap:4px;flex-shrink:0')}>${rows.map(r => `<div style="display:flex;align-items:center;justify-content:space-between;font-size:13px;line-height:1.9"><span style="color:var(--muted)">${r[0]}</span><span style="font-weight:700;${r[2] || ''}">${r[1]}</span></div>`).join('')}</div>`;
const orderCard = (o) => o.kind === 'svc' || o.kind === 'inv' ? `<div ${glass(36, '16px', 'display:flex;flex-direction:column;gap:10px')}><div style="display:flex;align-items:center;justify-content:space-between"><span style="font-size:15px;font-weight:700">${esc(o.title)}</span>${o.bad ? badge('bad', o.label) : o.done ? badge('done', o.label) : badge('wait', o.label)}</div><div style="display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)"><span>${o.kind === 'svc' ? fa(o.qty) + ' عدد · <span dir="ltr">' + esc(o.channel) + '</span>' : 'فاکتور خرید'}</span><span>کد پیگیری <span style="font-weight:700;color:var(--ink)">${fa(o.code)}</span></span></div></div>` : `<div ${glass(36, '16px', 'display:flex;flex-direction:column;gap:10px')}><div style="display:flex;align-items:center;justify-content:space-between"><span style="font-size:15px;font-weight:700;direction:ltr">${esc(o.channel)}</span>${o.removed ? badge('bad', o.rlabel || 'ربات عزل شد') : o.done ? badge('done', 'تکمیل شد') : badge('wait', 'در حال انجام')}</div>${bar(Math.round(o.cur / Math.max(o.total, 1) * 100), o.done)}<div style="display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)"><span>${fa(o.cur)} از ${fa(o.total)} عضو</span><span>کد پیگیری <span style="font-weight:700;color:var(--ink)">${fa(o.code)}</span></span></div></div>`;
const empty = (t) => `<div style="margin:14px 28px 0;text-align:center;color:var(--muted);font-size:13px;line-height:1.9">${t}</div>`;

  const stat = (l, v) => `<div style="background:rgba(255,255,255,0.1);border-radius:36px;padding:12px 18px;display:flex;flex-direction:column;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.1)"><span style="font-size:11px;color:var(--hsub)">${lab(l, 14)}</span><span style="font-size:13px;font-weight:700">${v}</span></div>`;
  const action = (act, primary, icon, t, sub) => `<button class="${primary ? '' : 'glass '}press" data-act="${act}" style="border:${primary ? '0' : '1px solid var(--edge)'};text-align:start;cursor:pointer;display:flex;align-items:center;gap:14px;padding:12px 16px 12px 14px;border-radius:30px;background:var(${primary ? '--primary' : '--surface'});color:${primary ? '#FFFFFF' : 'var(--ink)'};box-shadow:${primary ? 'var(--pshadow)' : 'var(--shadow)'};font-family:inherit"><span style="width:46px;height:46px;flex-shrink:0;border-radius:15px;background:${primary ? 'rgba(255,255,255,0.2)' : 'var(--reqt)'};color:${primary ? '#FFFFFF' : 'var(--reqc)'};display:flex;align-items:center;justify-content:center">${ic(icon, 24)}</span><span style="flex:1;display:flex;flex-direction:column"><span style="font-size:15px;font-weight:800;line-height:1.6">${t}</span><span style="font-size:12px;color:${primary ? 'var(--onprimarysub)' : 'var(--muted)'};line-height:1.5">${sub}</span></span><span style="display:flex;opacity:.7">${ic(P.chevL, 18)}</span></button>`;

${hero(`<div style="position:relative;display:flex;align-items:center;justify-content:space-between;padding:14px 18px 20px"><div style="display:flex;flex-direction:column"><span style="font-size:14px;color:var(--hsub)">${lab('دارایی شما', 17)}</span><div style="display:flex;align-items:baseline;gap:8px"><span style="font-size:56px;font-weight:800;line-height:1.1">${num(d.balance)}</span><span style="font-size:16px;font-weight:500;color:#F5A524">شاهی</span></div></div>${COIN(68)}</div><div style="position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">${stat('هزینه هر عضو', fa(c.tokensPerMember) + ' شاهی')}${stat('پاداش هر جوین', fa(c.joinReward) + ' شاهی')}</div>`, '8px 16px 0')}

${qa('goSvc', 'reaction', ['aredt', 'ared'], P.heart, 'خرید ری‌اکشن')}${qa('goSvc', 'premium', ['gifttint', 'gifticon'], P.diamond, 'خرید ری‌اکشن پرمیومی')}${qa('goSponsor', '', ['agreent', 'agreen'], P.star, 'خرید اسپانسری')}${qa('goTransfer', '', ['muted', 'muted'], P.coins, 'انتقال موجودی')}

function linkRow(link) {
  return `<div style="display:flex;gap:8px"><div class="round" style="flex:1;min-width:0;height:48px;box-sizing:border-box;border-radius:24px;background:var(--field);padding:0 16px;display:flex;align-items:center;direction:ltr;font-size:13px;color:var(--muted)"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc((link || '').replace('https://', ''))}</span></div><button class="round press" data-act="copy" style="height:48px;border:0;border-radius:24px;background:var(--primary);color:#FFFFFF;font-size:14px;font-weight:700;padding:0 20px;display:flex;align-items:center;gap:8px;cursor:pointer;box-shadow:var(--pshadow)">${ic(P.copy, 18)}<span>${S.copied ? 'کپی شد' : 'کپی لینک'}</span></button></div>`;
}

function pageJoin() {
  const c = cfg(), list = S.list;

  else body = `<div style="display:flex;flex-direction:column;gap:10px;margin:8px 16px 0;flex-shrink:0">${list.map((it, i) => row(it, i) + (i === 0 ? slot : '')).join('')}</div>`;

${hero(`<div style="position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">${stat('پاداش هر جوین', fa(c.joinReward) + ' شاهی')}${stat('پاداش این نوبت', num(S.session * c.joinReward) + ' شاهی', 'color:#F5A524')}</div>`, '16px 16px 0')}
${dashed('gift', `اگر از کانالی لفت بدی، ${fa(c.leavePenalty)} شاهی ازت کم می‌شه.`, 32, 'قانون ترک کانال', P.warn)}
<div style="display:flex;align-items:center;justify-content:space-between;margin:20px 20px 0;flex-shrink:0"><span style="font-size:15px;font-weight:700">${title}</span><button data-act="refreshList" style="border:0;background:transparent;color:var(--accent);font-size:13px;font-weight:500;padding:4px 0;cursor:pointer">${S.listLoading && list !== undefined ? 'در حال به‌روزرسانی…' : 'به‌روزرسانی'}</button></div>

function pageOrders() {

/* مورف ساده: عناصر جاافتاده را درجا به‌روز می‌کند تا ترنزیشن‌ها (نوار لغزان، بارها، تیک‌ها) نرم بمانند */
function morph(a, b) {
  const ac = Array.from(a.childNodes), bc = Array.from(b.childNodes);
  for (let i = 0; i < bc.length; i++) {
    const x = ac[i], y = bc[i];
    if (!x) { a.appendChild(y.cloneNode(true)); continue; }
    if (x.nodeType !== y.nodeType || x.nodeName !== y.nodeName) { a.replaceChild(y.cloneNode(true), x); continue; }
    if (x.nodeType === 3) { if (x.nodeValue !== y.nodeValue) x.nodeValue = y.nodeValue; continue; }
    if (x.nodeType !== 1) continue;
    for (const at of Array.from(x.attributes)) if (!y.hasAttribute(at.name)) x.removeAttribute(at.name);
    for (const at of Array.from(y.attributes)) if (x.getAttribute(at.name) !== at.value) x.setAttribute(at.name, at.value);
    if (x.nodeName === 'INPUT') { if (document.activeElement !== x && x.value !== (y.getAttribute('value') || '')) x.value = y.getAttribute('value') || ''; }
    else morph(x, y);
  }
  while (a.childNodes.length > bc.length) a.removeChild(a.lastChild);
}

  document.querySelectorAll('.sp-orb').forEach(o => { o.innerHTML = ic(P.mega, 34); });
  const tags = ['عضو کانال او شو، شاهی بگیر', 'با شاهی، درخواست JFJ بده', 'او هم عضو کانال تو می‌شود'];
  let ti = 0; const tg = $('spTag');
  const showTag = () => { tg.style.opacity = 0; tg.style.transform = 'translateY(6px)'; setTimeout(() => { tg.textContent = tags[ti++ % 3]; tg.style.opacity = 1; tg.style.transform = 'translateY(0)'; }, 350); };
  showTag(); SP.tagT = setInterval(showTag, 2300);
  $('spTick').innerHTML = TICK;
  spCap(34, 'در حال اتصال به ربات…');
  const fonts = Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), sleep(1200)]).then(() => spCap(52, 'آماده‌سازی ظاهر…'));
  window.__fonts = fonts;
  await loadState();
  if (!S.data && S.fj) { showFjGate(S.fj); return; }
  if (!S.data) { spError(S.loadError || 'خطایی رخ داد.'); return; }
  await afterState();
}
async function afterState() {
  spCap(76, 'دریافت اطلاعات حساب…');
  const jobs = [window.__fonts, preloadImg(S.data.user.photo), loadList(true).then(() => spCap(92, 'آماده‌سازی کانال‌ها…'))];
  await Promise.race([Promise.all(jobs), sleep(1500)]);
  spFinish();
}
/* ---- جوین اجباری داخل صفحه‌ی لودینگ ---- */
function showFjGate(list) {
  clearInterval(spTimer); clearInterval(SP.tagT);
  $('spArt').style.display = 'none'; $('spBar').style.display = 'none'; $('spTag').style.display = 'none';
  S.fjList = list; SP.gate = true;
  const g = $('fjGate'); g.style.display = 'flex';
  g.innerHTML = `<div style="text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:6px">
    <span class="round" style="width:64px;height:64px;border-radius:22px;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--pshadow)">${ic(P.mega, 32)}</span>
    <span style="font-size:18px;font-weight:800;line-height:1.7">اول عضو کانال‌های زیر شو</span>
    <span style="font-size:13px;color:var(--muted);line-height:1.9">بعد از عضویت، دکمه‌ی «عضو شدم» را بزن تا وارد شوی.</span></div>`
    + list.map((c, i) => `<div class="fjc"><span class="fjav">${esc((c.title || '؟').trim().charAt(0) || '؟')}</span><div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.title)}</div><div style="font-size:11.5px;color:var(--muted)">${c.sponsor ? 'اسپانسر' : 'کانال/گروه'}</div></div>${c.link ? `<button class="fjj press" data-act="fjOpen" data-i="${i}">عضویت</button>` : ''}</div>`).join('')
    + `<button class="round press" data-act="fjCheck" style="height:54px;border:0;border-radius:27px;background:var(--primary);color:#fff;font:inherit;font-size:15px;font-weight:800;cursor:pointer;margin-top:6px;box-shadow:var(--pshadow)">✅ عضو شدم، ورود</button>
    <span id="fjMsg" style="min-height:20px;text-align:center;font-size:12.5px;color:var(--rose)"></span>`;
  $('spMsg').textContent = '';
}
async function fjRecheck(manual) {
  if (SP.checking) return; SP.checking = true;
  const msg = $('fjMsg'); if (manual && msg) { msg.style.color = 'var(--muted)'; msg.textContent = 'در حال بررسی…'; }
  try {
    const r = await api('/api/fj');
    if (r.ok) {
      $('fjGate').style.display = 'none'; $('spArt').style.display = ''; $('spBar').style.display = ''; SP.gate = false;
      SP.p = 30; SP.fast = false; SP.cap = 34; $('spTag').style.display = ''; clearInterval(spTimer); spTimer = setInterval(spTick, 90); spCap(34, 'در حال ورود…');
      await loadState();
      if (S.data) { await afterState(); } else if (S.fj) { showFjGate(S.fj); } else { spError(S.loadError || 'خطایی رخ داد.'); }
    } else if (manual) {
      showFjGate(r.fj); const m2 = $('fjMsg'); if (m2) { m2.style.color = 'var(--rose)'; m2.textContent = 'هنوز در همه‌ی کانال‌ها عضو نشده‌ای.'; }
    }
  } catch (e) { if (manual && msg) { msg.style.color = 'var(--rose)'; msg.textContent = e.message; } }
  SP.checking = false;
}
A.fjOpen = (d) => { const c = (S.fjList || [])[+d.i]; if (c && c.link) openChat(c.link); };
A.fjCheck = () => fjRecheck(true);
document.addEventListener('visibilitychange', () => { if (document.hidden) return; if (SP.gate) fjRecheck(false); else if (S.data && !SP.active) loadState(true); });
render(true);
boot();
</script>
<script>
/* ایموجی‌ها همه‌جا به سبک آیفون (Apple) نمایش داده می‌شوند؛ اگر تصویر لود نشد همان ایموجی معمولی می‌ماند */
(function () {
  const BASES = ['https://cdn.jsdelivr.net/npm/emoji-datasource-apple@15.1.2/img/apple/64/', 'https://unpkg.com/emoji-datasource-apple@15.1.2/img/apple/64/'];
  const RE = /(?:[#*0-9]️?⃣|\p{Regional_Indicator}{2}|\p{Extended_Pictographic}(?:️|\p{Emoji_Modifier})?(?:‍\p{Extended_Pictographic}(?:️|\p{Emoji_Modifier})?)*)/gu;
  const SKIP = new Set(['SCRIPT', 'STYLE', 'TEXTAREA', 'INPUT', 'TITLE', 'NOSCRIPT', 'IMG']);
  const cps = (s) => Array.from(s).map((c) => c.codePointAt(0).toString(16));
  function names(e) {
    const a = cps(e), noFe = a.filter((x) => x !== 'fe0f'), out = [a.join('-')];
    if (noFe.join('-') !== out[0]) out.push(noFe.join('-'));
    const withFe = [noFe[0], 'fe0f'].concat(noFe.slice(1)).join('-');
    if (!out.includes(withFe)) out.push(withFe);
    return out;
  }
  function mk(e) {
    const img = document.createElement('img');
    img.className = 'ap'; img.alt = e; img.draggable = false; img.decoding = 'async';
    const tries = []; names(e).forEach((n) => BASES.forEach((b) => tries.push(b + n + '.png')));
    let i = 0;
    img.onerror = () => { i++; if (i < tries.length) img.src = tries[i]; else { const sp = document.createElement('span'); sp.className = 'noap'; sp.textContent = e; img.replaceWith(sp); } };
    img.src = tries[0];
    return img;
  }
  function walk(root) {
    if (!root || root.nodeType === 8) return;
    if (root.nodeType === 3) return fix(root);
    if (root.nodeType !== 1 || SKIP.has(root.tagName) || root.isContentEditable || root.classList.contains('noap')) return;
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: (n) => (n.parentNode && !SKIP.has(n.parentNode.tagName) && !(n.parentNode.classList && n.parentNode.classList.contains('noap')) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT) });
    const list = []; while (w.nextNode()) list.push(w.currentNode);
    list.forEach(fix);
  }
  function fix(n) {
    const t = n.nodeValue; if (!t || t.length > 4000) return;
    if (n.parentNode && n.parentNode.classList && n.parentNode.classList.contains('noap')) return;
    RE.lastIndex = 0; if (!RE.test(t)) return; RE.lastIndex = 0;
    const frag = document.createDocumentFragment(); let last = 0, m, any = false;
    while ((m = RE.exec(t))) {
      const e = m[0], cp = e.codePointAt(0);
      if (e.length === 1 && cp < 0x2300) continue; // ©, ®, ™, ‼ ... نماد متنی‌اند
      if (m.index > last) frag.appendChild(document.createTextNode(t.slice(last, m.index)));
      frag.appendChild(mk(e)); last = m.index + e.length; any = true;
    }
    if (!any) return;
    if (last < t.length) frag.appendChild(document.createTextNode(t.slice(last)));
    n.parentNode.replaceChild(frag, n);
  }
  let pend = new Set(), raf = 0;
  const mo = new MutationObserver((ms) => {
    ms.forEach((m) => { if (m.type === 'characterData') pend.add(m.target); else m.addedNodes.forEach((x) => pend.add(x)); });
    if (!raf) raf = requestAnimationFrame(() => { raf = 0; const l = Array.from(pend); pend = new Set(); l.forEach((x) => { if (x.isConnected) walk(x); }); });
  });
  function start() { walk(document.body); mo.observe(document.body, { childList: true, subtree: true, characterData: true }); }
  if (document.body) start(); else document.addEventListener('DOMContentLoaded', start);
})();
</script>
